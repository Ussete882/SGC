# Configuração de publicação no Netlify.
#
# No painel do Netlify, definir "Base directory" = prototipo-sgc.
# Feito isso, o Netlify lê este ficheiro e não é preciso configurar mais nada.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Aplicação de página única: qualquer caminho devolve o index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
